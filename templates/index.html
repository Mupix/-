<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PriceTracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dark">
  <header class="topbar">
    <h1>PriceTracker</h1>
    <div class="actions">
      <button id="btn-add">＋</button>
    </div>
  </header>

  <main class="container">
    <section class="dashboard">
      <div class="card stats">
        <h2>ダッシュボード</h2>
        <div id="stats">読み込み中...</div>
      </div>

      <div class="card list">
        <h2>登録商品</h2>
        <div id="product-list">読み込み中...</div>
      </div>
    </section>
  </main>

  <template id="add-dialog">
    <form id="add-form">
      <h3>商品を追加</h3>
      <label>商品名<br><input name="name" required></label><br>
      <label>商品URL<br><input name="url" required></label><br>
      <label>ショップ（任意）<br><input name="shop"></label><br>
      <label>取得間隔（分）<br>
        <select name="check_interval_minutes">
          <option value="60">1時間</option>
          <option value="15">15分</option>
          <option value="30">30分</option>
          <option value="180">3時間</option>
          <option value="360">6時間</option>
          <option value="720">12時間</option>
          <option value="1440">24時間</option>
        </select>
      </label><br>
      <button type="submit">追加</button>
      <button type="button" id="cancel">キャンセル</button>
    </form>
  </template>

  <template id="edit-dialog">
    <form id="edit-form">
      <h3>商品を編集</h3>
      <label>商品名<br><input name="name" required></label><br>
      <label>商品URL<br><input name="url" required></label><br>
      <label>ショップ（任意）<br><input name="shop"></label><br>
      <label>取得間隔（分）<br>
        <select name="check_interval_minutes">
          <option value="60">1時間</option>
          <option value="15">15分</option>
          <option value="30">30分</option>
          <option value="180">3時間</option>
          <option value="360">6時間</option>
          <option value="720">12時間</option>
          <option value="1440">24時間</option>
        </select>
      </label><br>
      <button type="submit">保存</button>
      <button type="button" id="cancel-edit">キャンセル</button>
    </form>
  </template>

  <script src="/static/js/app.js"></script>
</body>
</html>
